<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <title>PRESENT SIMPLE EXERCISESh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f7f8fd;
      --card: #ffffff;
      --text: #0b1120;
      --text-soft: #4b5563;
      --muted: #9ca3af;
      --border: #eaeef7;
      --brand: #6366f1;
      --brand-dark: #4f46e5;
      --brand-soft: #eef2ff;
      --accent: #06b6d4;
      --green: #10b981;
      --green-soft: #ecfdf5;
      --green-border: #a7f3d0;
      --red: #ef4444;
      --red-soft: #fef2f2;
      --red-border: #fecaca;
      --yellow: #f59e0b;
      --orange: #f97316;
      --shadow-xs: 0 1px 2px rgba(15, 23, 42, .04);
      --shadow-sm: 0 4px 14px rgba(15, 23, 42, .05);
      --shadow: 0 10px 30px -8px rgba(15, 23, 42, .12);
      --shadow-lg: 0 30px 60px -20px rgba(79, 70, 229, .35);
      --radius: 20px;
      --radius-lg: 28px;
      --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      font-size: 16px;
      font-weight: 500;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      overflow-x: hidden;
      background-image:
        radial-gradient(circle at 15% 0%, rgba(99, 102, 241, .08), transparent 45%),
        radial-gradient(circle at 100% 20%, rgba(6, 182, 212, .07), transparent 40%);
      background-attachment: fixed;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
    }

    input,
    textarea {
      font-family: inherit;
    }

    /* ================= HEADER ================= */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, .82);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid rgba(234, 238, 247, .8);
    }

    .nav {
      max-width: 1000px;
      margin: 0 auto;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 11px;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: -.02em;
      transition: transform .25s ease;
      white-space: nowrap;
    }

    .logo:hover {
      transform: translateY(-1px);
    }

    .logo .dot {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--brand) 0%, var(--accent) 100%);
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .5px;
      box-shadow: 0 6px 16px rgba(99, 102, 241, .4);
      flex-shrink: 0;
    }

    .nav-links {
      margin-left: auto;
      display: flex;
      gap: 4px;
      background: rgba(238, 242, 255, .6);
      padding: 4px;
      border-radius: 12px;
    }

    .nav-links a {
      padding: 8px 16px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-soft);
      transition: all .2s ease;
      white-space: nowrap;
    }

    .nav-links a:hover {
      color: var(--brand-dark);
      background: #fff;
    }

    .nav-links a.active {
      background: #fff;
      color: var(--brand-dark);
      box-shadow: 0 2px 8px rgba(99, 102, 241, .15);
    }

    /* ================= LAYOUT ================= */
    .wrap {
      max-width: 1000px;
      margin: 0 auto;
      padding: 32px 24px 100px;
    }

    /* ================= HERO ================= */
    .exercise-hero {
      background: linear-gradient(135deg, #4f46e5 0%, #6366f1 45%, #8b5cf6 100%);
      color: #fff;
      border-radius: var(--radius-lg);
      padding: 36px 40px;
      margin-bottom: 32px;
      box-shadow: var(--shadow-lg);
      position: relative;
      overflow: hidden;
    }

    .exercise-hero::before {
      content: "";
      position: absolute;
      top: -80px;
      right: -80px;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .12);
      pointer-events: none;
    }

    .exercise-hero h1 {
      font-size: clamp(24px, 3.4vw, 34px);
      font-weight: 800;
      letter-spacing: -.025em;
      line-height: 1.15;
      margin-bottom: 10px;
      position: relative;
      padding-right: 200px;
    }

    .exercise-hero p {
      font-size: 15.5px;
      opacity: .92;
      max-width: 620px;
      position: relative;
      margin-bottom: 22px;
    }

    .exercise-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      position: relative;
    }

    .meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: rgba(255, 255, 255, .16);
      border: 1px solid rgba(255, 255, 255, .28);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      backdrop-filter: blur(8px);
    }

    .meta-pill strong {
      font-weight: 800;
    }

    /* Nút In + Đáp án trong hero */
    .print-toggle,
    .print-answer-toggle {
      position: absolute;
      top: 24px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background: rgba(255, 255, 255, .18);
      border: 1px solid rgba(255, 255, 255, .35);
      color: #fff;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all .25s cubic-bezier(.4, 0, .2, 1);
      backdrop-filter: blur(10px);
      font-family: inherit;
      z-index: 5;
    }

    .print-toggle {
      right: 24px;
    }

    .print-answer-toggle {
      right: 200px;
    }

    .print-toggle:hover,
    .print-answer-toggle:hover {
      background: rgba(255, 255, 255, .3);
      transform: translateY(-2px);
    }

    .print-answer-toggle.active {
      background: #10b981;
      border-color: #10b981;
      box-shadow: 0 8px 22px -6px rgba(16, 185, 129, .5);
    }

    /* body:not(.print-mode) .print-answer-toggle { display: none; } */

    /* ================= STICKY SCORE BAR ================= */
    .score-bar {
      position: sticky;
      top: 68px;
      z-index: 50;
      margin-bottom: 26px;
      padding: 14px 22px;
      background: rgba(255, 255, 255, .92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .score-bar .progress-mini {
      flex: 1 1 200px;
      height: 8px;
      background: #e8ecf6;
      border-radius: 999px;
      overflow: hidden;
    }

    .score-bar .progress-mini .fill {
      height: 100%;
      background: linear-gradient(90deg, var(--brand), var(--accent));
      border-radius: 999px;
      transition: width .5s cubic-bezier(.4, 0, .2, 1);
      width: 0%;
    }

    .score-bar .stat {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .score-bar .stat.correct {
      color: var(--green);
      background: var(--green-soft);
      border: 1px solid var(--green-border);
    }

    .score-bar .stat.wrong {
      color: var(--red);
      background: var(--red-soft);
      border: 1px solid var(--red-border);
    }

    .score-bar .stat.progress {
      color: var(--brand-dark);
      background: var(--brand-soft);
      border: 1px solid #c7d2fe;
    }

    /* ================= SECTION ================= */
    .section-block {
      margin-bottom: 24pt;
      break-inside: auto;
      page-break-inside: auto;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 2px dashed var(--border);
    }

    .section-header .icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 22px;
      background: linear-gradient(135deg, var(--brand-soft), #e0e7ff);
      flex-shrink: 0;
      box-shadow: 0 4px 12px -4px rgba(99, 102, 241, .3);
    }

    .section-header .text h2 {
      font-size: clamp(18px, 2.2vw, 22px);
      font-weight: 800;
      letter-spacing: -.025em;
      color: var(--text);
      line-height: 1.25;
      margin-bottom: 3px;
    }

    .section-header .text p {
      font-size: 14px;
      color: var(--text-soft);
      font-weight: 500;
    }

    .section-header .badge-count {
      margin-left: auto;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 14px;
      background: var(--brand-soft);
      color: var(--brand-dark);
      border-radius: 999px;
      white-space: nowrap;
    }

    /* ================= CÂU HỎI ================= */
    .q-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 26px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-xs);
      transition: all .3s cubic-bezier(.4, 0, .2, 1);
      position: relative;
      overflow: hidden;
    }

    .q-item::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--border);
      transition: background .3s ease;
    }

    .q-item.correct::before {
      background: var(--green);
    }

    .q-item.wrong::before {
      background: var(--red);
    }

    .q-item.correct {
      border-color: var(--green-border);
      background: linear-gradient(135deg, #ffffff, #f7fdfb);
    }

    .q-item.wrong {
      border-color: var(--red-border);
      background: linear-gradient(135deg, #ffffff, #fff8f8);
    }

    .q-head {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 8px;
    }

    .q-num {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      font-size: 14px;
      font-weight: 800;
      background: var(--brand-soft);
      color: var(--brand-dark);
      font-family: var(--mono);
      transition: all .3s ease;
    }

    .q-item.correct .q-num {
      background: var(--green);
      color: #fff;
    }

    .q-item.wrong .q-num {
      background: var(--red);
      color: #fff;
    }

    .q-body {
      flex: 1;
      min-width: 0;
    }

    .q-text {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.5;
      letter-spacing: -.01em;
      color: var(--text);
      word-wrap: break-word;
    }

    /* ================= OPTIONS ================= */
    .options {
      display: grid;
      grid-template-columns: repeat(2, minmax(240px, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 16px;
      background: #fff;
      border: 2px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      transition: all .2s cubic-bezier(.4, 0, .2, 1);
      text-align: left;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    .option:hover:not(.disabled) {
      border-color: var(--brand);
      background: #fafbff;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px -6px rgba(99, 102, 241, .2);
    }

    .option .key {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 800;
      background: #f1f4fb;
      color: var(--text-soft);
      flex-shrink: 0;
      transition: all .2s ease;
      font-family: var(--mono);
    }

    .option:hover:not(.disabled) .key {
      background: var(--brand);
      color: #fff;
    }

    .option .text {
      flex: 1;
    }

    .option.disabled {
      cursor: default;
    }

    .option.correct {
      border-color: var(--green);
      background: var(--green-soft);
    }

    .option.correct .key {
      background: var(--green);
      color: #fff;
    }

    .option.wrong {
      border-color: var(--red);
      background: var(--red-soft);
    }

    .option.wrong .key {
      background: var(--red);
      color: #fff;
    }

    .option.dimmed {
      opacity: .55;
    }

    /* ================= INPUT / TEXTAREA ================= */
    .input-wrap {
      /* margin-top: 14px; */
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .text-input {
      flex: 1 1 240px;
      min-width: 0;
      padding: 13px 16px;
      border: 2px solid var(--border);
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      background: #fff;
      transition: all .2s ease;
      font-family: var(--mono);
      outline: none;
    }

    .text-input::placeholder {
      color: var(--muted);
      font-weight: 500;
      font-family: var(--font);
    }

    .text-input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, .12);
    }

    .text-input:disabled {
      cursor: default;
      background: #fafbfe;
    }

    .q-item.correct .text-input {
      border-color: var(--green);
      background: var(--green-soft);
      color: #065f46;
    }

    .q-item.wrong .text-input {
      border-color: var(--red);
      background: var(--red-soft);
      color: #7f1d1d;
    }

    .textarea {
      width: 100%;
      margin-top: 14px;
      padding: 14px 16px;
      border: 2px solid var(--border);
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      background: #fff;
      transition: all .2s ease;
      font-family: var(--font);
      outline: none;
      resize: vertical;
      min-height: 70px;
      line-height: 1.55;
    }

    .textarea::placeholder {
      color: var(--muted);
      font-weight: 500;
    }

    .textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, .12);
    }

    .textarea:disabled {
      cursor: default;
      background: #fafbfe;
    }

    .q-item.correct .textarea {
      border-color: var(--green);
      background: var(--green-soft);
    }

    .q-item.wrong .textarea {
      border-color: var(--red);
      background: var(--red-soft);
    }

    /* ================= REORDER ================= */
    .reorder-words {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 16px;
      background: #f8faff;
      border: 2px dashed #dbe2f0;
      border-radius: 14px;
      margin-top: 14px;
      min-height: 60px;
    }

    .word-chip {
      display: inline-flex;
      align-items: center;
      padding: 9px 16px;
      background: #fff;
      border: 2px solid var(--border);
      border-radius: 10px;
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text);
      font-family: inherit;
      cursor: pointer;
      transition: all .2s cubic-bezier(.4, 0, .2, 1);
      box-shadow: 0 2px 6px rgba(0, 0, 0, .04);
    }

    .word-chip:hover:not(:disabled):not(.used) {
      border-color: var(--brand);
      background: var(--brand-soft);
      color: var(--brand-dark);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px -4px rgba(99, 102, 241, .3);
    }

    .word-chip.used {
      opacity: .25;
      pointer-events: none;
      filter: grayscale(1);
    }

    .word-chip:disabled {
      cursor: default;
    }

    .reorder-answer {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 16px;
      background: #fff;
      border: 2px solid var(--border);
      border-radius: 14px;
      margin-top: 12px;
      min-height: 62px;
      align-items: center;
      transition: border-color .3s ease;
    }

    .q-item.correct .reorder-answer {
      border-color: var(--green);
      background: var(--green-soft);
    }

    .q-item.wrong .reorder-answer {
      border-color: var(--red);
      background: var(--red-soft);
    }

    .reorder-placeholder {
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
      font-style: italic;
      user-select: none;
    }

    .word-chip-answer {
      display: inline-flex;
      align-items: center;
      padding: 9px 16px;
      background: linear-gradient(135deg, var(--brand), var(--brand-dark));
      color: #fff;
      border: 2px solid var(--brand-dark);
      border-radius: 10px;
      font-size: 14.5px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all .18s ease;
      box-shadow: 0 4px 12px -4px rgba(99, 102, 241, .4);
      animation: chipIn .25s cubic-bezier(.34, 1.56, .64, 1) both;
    }

    @keyframes chipIn {
      from {
        opacity: 0;
        transform: scale(.7);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .word-chip-answer:hover:not(:disabled) {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 8px 20px -4px rgba(99, 102, 241, .5);
    }

    .q-item.correct .word-chip-answer {
      background: linear-gradient(135deg, var(--green), #059669);
      border-color: #059669;
    }

    .q-item.wrong .word-chip-answer {
      background: linear-gradient(135deg, var(--red), #dc2626);
      border-color: #dc2626;
    }

    .word-chip-answer:disabled {
      cursor: default;
    }

    .reorder-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .btn-ghost-dark {
      background: #f1f4fb;
      color: var(--text-soft);
      border: 1px solid var(--border);
    }

    .btn-ghost-dark:hover {
      background: #e8ecf6;
      color: var(--text);
    }

    /* ================= TRANSLATE ================= */
    .translate-prompt {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 16px 18px;
      background: linear-gradient(135deg, #fff8f0, #fff5eb);
      border: 1px solid #ffe0c2;
      border-left: 4px solid var(--orange);
      border-radius: 12px;
      margin-top: 14px;
      font-size: 15.5px;
      font-weight: 700;
      color: #7c2d12;
      line-height: 1.5;
    }

    .translate-prompt .flag {
      font-size: 22px;
      line-height: 1;
      flex-shrink: 0;
    }

    /* ================= FEEDBACK ================= */
    .feedback {
      margin-top: 16px;
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      animation: slideIn .35s cubic-bezier(.2, .8, .2, 1) both;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .feedback.correct {
      background: var(--green-soft);
      border: 1px solid var(--green-border);
      color: #065f46;
    }

    .feedback.wrong {
      background: var(--red-soft);
      border: 1px solid var(--red-border);
      color: #7f1d1d;
    }

    .feedback .emoji {
      font-size: 20px;
      line-height: 1;
      flex-shrink: 0;
    }

    .feedback b {
      font-weight: 800;
    }

    .feedback .correct-ans {
      display: inline-block;
      font-family: var(--mono);
      background: rgba(255, 255, 255, .7);
      border: 1px solid rgba(0, 0, 0, .08);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 13px;
      margin: 0 2px;
      font-weight: 700;
    }

    .feedback .fb-vi {
      display: block;
      margin-top: 6px;
      font-size: 13px;
      color: #475569;
      font-style: italic;
    }

    /* ================= BUTTONS ================= */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 24px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14.5px;
      letter-spacing: -.01em;
      border: 1px solid transparent;
      transition: all .22s cubic-bezier(.4, 0, .2, 1);
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--brand), var(--brand-dark));
      color: #fff;
      box-shadow: 0 8px 22px -6px rgba(99, 102, 241, .5);
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 14px 32px -8px rgba(99, 102, 241, .6);
    }

    .btn-primary:disabled {
      opacity: .5;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-secondary {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      border-color: var(--brand);
      color: var(--brand-dark);
      transform: translateY(-2px);
    }

    .btn .arrow {
      display: inline-block;
      transition: transform .3s ease;
    }

    .btn:hover:not(:disabled) .arrow {
      transform: translateX(4px);
    }

    /* ================= BOTTOM ACTION ================= */
    .bottom-action {
      margin-top: 48px;
      padding: 32px 30px;
      background: linear-gradient(135deg, #eef2ff, #e0e7ff);
      border: 1px solid #c7d2fe;
      border-radius: var(--radius-lg);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .bottom-action::before {
      content: "";
      position: absolute;
      top: -80px;
      right: -80px;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: rgba(99, 102, 241, .1);
      pointer-events: none;
    }

    .bottom-action h3 {
      font-size: clamp(19px, 2.4vw, 24px);
      font-weight: 800;
      letter-spacing: -.025em;
      color: var(--brand-dark);
      margin-bottom: 8px;
      position: relative;
    }

    .bottom-action p {
      font-size: 14.5px;
      color: var(--text-soft);
      margin-bottom: 22px;
      position: relative;
      font-weight: 500;
    }

    .bottom-action .btn {
      padding: 15px 30px;
      font-size: 15px;
    }

    /* ================= MODAL ================= */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: rgba(15, 23, 42, .55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn .3s ease both;
      overflow-y: auto;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .modal {
      background: #fff;
      border-radius: var(--radius-lg);
      padding: 44px 36px 36px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 40px 80px -20px rgba(0, 0, 0, .4);
      animation: modalIn .45s cubic-bezier(.34, 1.56, .64, 1) both;
      margin: auto;
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: scale(.9) translateY(20px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .modal-emoji {
      font-size: 66px;
      line-height: 1;
      margin-bottom: 18px;
      display: inline-block;
      animation: bounce .8s cubic-bezier(.34, 1.56, .64, 1) both;
    }

    @keyframes bounce {
      0% {
        transform: scale(0) rotate(-20deg);
      }

      60% {
        transform: scale(1.15) rotate(5deg);
      }

      100% {
        transform: scale(1) rotate(0);
      }
    }

    .modal h2 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -.025em;
      margin-bottom: 10px;
      color: var(--text);
    }

    .modal .sub {
      font-size: 15px;
      color: var(--text-soft);
      margin-bottom: 26px;
    }

    .modal .score-big {
      font-size: 56px;
      font-weight: 800;
      letter-spacing: -.04em;
      line-height: 1;
      background: linear-gradient(135deg, var(--brand), var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .modal .score-detail {
      font-size: 14.5px;
      color: var(--text-soft);
      margin-bottom: 28px;
    }

    .modal .score-detail b {
      color: var(--green);
      font-weight: 800;
    }

    .modal .score-detail .wrong-b {
      color: var(--red);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .modal-actions .btn {
      flex: 1 1 160px;
    }

    /* =========================================================
   PRINT MODE
   ========================================================= */
    .print-header {
      display: none;
    }

    .exit-print {
      display: none;
    }

    .answer-key {
      display: none;
    }

    body.print-mode header,
    body.print-mode .exercise-hero,
    body.print-mode .score-bar,
    body.print-mode .bottom-action,
    body.print-mode .feedback,
    body.print-mode .btn-check,
    body.print-mode .btn-reset,
    body.print-mode .reorder-actions {
      display: none !important;
    }

    body.print-mode .wrap {
      max-width: 900px;
      padding: 30px 24px 60px;
    }

    body.print-mode .print-header {
      display: block;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 3px double #0b1120;
    }

    .print-header h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -.02em;
      color: var(--text);
      margin-bottom: 6px;
      text-align: center;
    }

    .print-header .sub {
      text-align: center;
      font-size: 14px;
      color: var(--text-soft);
      margin-bottom: 16px;
    }

    .print-header .info-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      font-size: 14px;
      color: var(--text);
      flex-wrap: wrap;
      padding-top: 10px;
      border-top: 1px dashed #cbd5e1;
    }

    .print-header .info-row span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .print-header .info-row .line {
      display: inline-block;
      min-width: 180px;
      border-bottom: 1px solid #94a3b8;
    }

    /* Nút điều khiển chế độ in */
    body.print-mode .exit-print,
    body.print-mode .print-toggle,
    body.print-mode .print-answer-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      position: fixed;
      top: 20px;
      z-index: 200;
      padding: 12px 22px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      border: none;
      transition: all .25s ease;
    }

    body.print-mode .exit-print {
      left: 20px;
      background: #0b1120;
      color: #fff;
      box-shadow: 0 12px 30px -8px rgba(0, 0, 0, .5);
    }

    body.print-mode .exit-print:hover {
      transform: translateY(-2px);
      background: #1e293b;
    }

    body.print-mode .print-toggle {
      right: 20px;
      background: var(--brand);
      color: #fff;
      box-shadow: 0 12px 30px -8px rgba(99, 102, 241, .5);
    }

    body.print-mode .print-toggle:hover {
      transform: translateY(-2px);
      background: var(--brand-dark);
    }

    body.print-mode .print-answer-toggle {
      right: 180px;
      background: #fff;
      color: var(--text);
      border: 2px solid var(--border);
      box-shadow: 0 12px 30px -8px rgba(0, 0, 0, .1);
    }

    body.print-mode .print-answer-toggle:hover {
      transform: translateY(-2px);
      border-color: var(--green);
      color: var(--green);
    }

    body.print-mode .print-answer-toggle.active {
      background: var(--green);
      color: #fff;
      border-color: var(--green);
    }

    /* Câu hỏi gọn trong chế độ in */
    body.print-mode .section-block {
      margin-bottom: 36px;
      break-inside: avoid;
    }

    body.print-mode .section-header {
      margin-bottom: 18px;
      padding-bottom: 10px;
      border-bottom: 2px solid #0b1120;
    }

    body.print-mode .section-header .icon {
      background: #f3f4f6;
      box-shadow: none;
      border: 1px solid #e5e7eb;
    }

    body.print-mode .section-header .badge-count {
      background: #f3f4f6;
      color: var(--text);
    }

    body.print-mode .q-item {
      padding: 5px 0;
      margin-bottom: 0;
      border: none;
      border-bottom: 1px dashed #d1d5db;
      border-radius: 0;
      background: transparent !important;
      box-shadow: none;
      break-inside: avoid;
    }

    body.print-mode .q-item::before {
      display: none;
    }

    body.print-mode .q-item.correct,
    body.print-mode .q-item.wrong {
      background: transparent !important;
      border-color: #d1d5db;
    }

    body.print-mode .q-num {
      width: 29px;
      height: 26px;
      background: #0b1120 !important;
      color: #fff !important;
      border-radius: 8px;
    }

    body.print-mode .q-text {
      font-size: 13px;
      font-weight: 700;
      color: #000;
    }

    body.print-mode .options {
      font-size: 13px;
      display: grid !important;
      grid-template-columns: repeat(4, 1fr) !important;
      gap: 1px 20px !important;
      margin-top: 2px !important;
    }

    body.print-mode .correct {
      grid-template-columns: repeat(2, 1fr) !important;

    }

    body.print-mode .option {
      padding: 4px 0 !important;
      border: none !important;
      background: transparent !important;
      border-radius: 0 !important;
      font-size: 13px !important;
      font-weight: 600 !important;
      color: #000 !important;
      cursor: default !important;
      transform: none !important;
      box-shadow: none !important;
    }

    body.print-mode .option .key {
      background: transparent !important;
      color: #000 !important;
      border: 1px solid #94a3b8 !important;
      width: 24px !important;
      height: 24px !important;
      border-radius: 50% !important;
      font-size: 11px !important;
    }


    body.print-mode .text-input,
    body.print-mode .reorder-answer {
      border: none !important;
      border-bottom: 1.5px solid #94a3b8 !important;
      border-radius: 0 !important;
      background: transparent !important;
      padding: 4px 0 !important;
      color: #000 !important;
      box-shadow: none !important;
      min-height: 30px !important;
    }

    body.print-mode .textarea {
      margin: 0;
      height: 26px !important;
      min-height: 26px !important;
      max-height: 26px !important;
      border: none !important;
      border-bottom: 1.5px solid #94a3b8 !important;
      border-radius: 0 !important;
      padding: 0 0 2px 0 !important;
      background: transparent !important;
      box-shadow: none !important;
      resize: none !important;
      line-height: 22px !important;
      overflow: hidden !important;
      vertical-align: baseline !important;
    }

    body.print-mode .text-input::placeholder,
    body.print-mode .textarea::placeholder {
      color: transparent !important;
    }

    body.print-mode .reorder-words {
      padding: 10px 12px !important;
      background: #f9fafb !important;
      border: 1px dashed #94a3b8 !important;
      border-radius: 8px !important;
      min-height: auto !important;
    }

    body.print-mode .word-chip {
      padding: 4px 12px !important;
      border: 1px solid #94a3b8 !important;
      background: #fff !important;
      font-size: 14px !important;
      border-radius: 6px !important;
      box-shadow: none !important;
      transform: none !important;
      color: #000 !important;
    }

    body.print-mode .word-chip.used {
      opacity: 1 !important;
      filter: none !important;
      pointer-events: auto !important;
    }

    body.print-mode .reorder-answer .reorder-placeholder {
      color: #94a3b8 !important;
      font-style: italic;
    }

    /* ================= ĐÁP ÁN ================= */
    body.print-mode.answer-key-on .answer-key {
      display: block;
    }

    .answer-key {
      margin-top: 60px;
      padding-top: 30px;
      position: relative;
      page-break-before: always;
      break-before: page;
    }

    .answer-key::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      border-top: 2px dashed #94a3b8;
    }

    .answer-key .cut-label {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      background: #fff;
      padding: 2px 16px;
      font-size: 12px;
      font-weight: 700;
      color: #64748b;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .answer-key h2 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -.02em;
      color: var(--text);
      margin-bottom: 8px;
      text-align: center;
    }

    .answer-key .sub {
      text-align: center;
      font-size: 13.5px;
      color: var(--text-soft);
      margin-bottom: 26px;
    }

    .answer-key .section-key {
      margin-bottom: 24px;
      break-inside: avoid;
    }

    .answer-key .section-key h3 {
      font-size: 15px;
      font-weight: 800;
      color: var(--brand-dark);
      letter-spacing: -.01em;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .answer-key .key-list {
      list-style: none;
      padding: 0;
      display: grid;
      gap: 8px;
    }

    .answer-key .key-list li {
      display: flex;
      gap: 10px;
      padding: 10px 14px;
      background: #f9fafb;
      border-left: 3px solid #10b981;
      border-radius: 6px;
      font-size: 13.5px;
      line-height: 1.55;
    }

    .answer-key .key-list li .num {
      font-weight: 800;
      color: #0b1120;
      font-family: var(--mono);
      min-width: 24px;
      flex-shrink: 0;
    }

    .answer-key .key-list li .ans-body {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }

    .answer-key .key-list li .ans {
      font-weight: 800;
      color: #059669;
      margin-right: 6px;
    }

    .answer-key .key-list li .exp {
      color: #64748b;
      font-style: italic;
      font-size: 12.5px;
    }

    .answer-key .key-list li .vi-line {
      font-size: 12.5px;
      color: #475569;
      padding-top: 5px;
      border-top: 1px dashed #e2e8f0;
      margin-top: 3px;
      line-height: 1.5;
    }

    .answer-key .key-list li .vi-line b {
      color: #6366f1;
      font-weight: 700;
      margin-right: 3px;
    }

        padding-right: 0;
      }

        padding: 12px 16px;

      }

      .q-item {
        padding: 20px;

        top: 12px;

      }

    /* ================= @MEDIA PRINT ================= */
    @media print {
      body {
        background: #fff !important;
        font-size: 12.5pt;
        color: #000;
      }

      header,
      .exercise-hero,
      .score-bar,
      .bottom-action,
      .print-toggle,
      .print-answer-toggle,
      .exit-print,
      .feedback,
      .btn,
      .btn-check,
      .btn-reset,
      .reorder-actions {
        display: none !important;
      }

      .wrap {
        max-width: 100% !important;
        padding: 0 !important;
      }

      .print-header {
        display: block !important;
      }

      .section-block {
        margin-bottom: 24pt;
        break-inside: avoid;
      }

      .section-header {
        border-bottom: 1.5pt solid #000;
        margin-bottom: 10pt;
        padding-bottom: 6pt;
      }

      .section-header .icon {
        background: #f3f4f6 !important;
        border: 1px solid #ccc !important;
        box-shadow: none !important;
      }

          { q: "Which of the following is grammatically correct?", options: ["The train leave at 8 a.m. every morning.", "The train leaves at 8 a.m. every morning.", "The train is leaving at 8 a.m. every morning.", "The train leaving at 8 a.m. every morning."], answer: 1, vi: "Tàu khởi hành lúc 8 giờ sáng mỗi ngày.", explain: "Lịch trình cố định → hiện tại đơn. Chủ ngữ <b>The train</b> (số ít) → <b>leaves</b>: <b>The train leaves at 8 a.m. every morning.</b>" },
          { q: "Which of the following is grammatically correct?", options: ["The Earth move around the Sun.", "The Earth moves around the Sun.", "The Earth is moving around the Sun.", "The Earth moving around the Sun."], answer: 1, vi: "Trái Đất quay quanh Mặt Trời.", explain: "Sự thật hiển nhiên → hiện tại đơn. Chủ ngữ <b>The Earth</b> (số ít) → <b>moves</b>: <b>The Earth moves around the Sun.</b>" },
          { q: "Which of the following is grammatically correct?", options: ["Birds flies south in winter.", "Birds fly south in winter.", "Birds is flying south in winter.", "Birds flying south in winter."], answer: 1, vi: "Chim bay về phương nam vào mùa đông.", explain: "Chủ ngữ <b>Birds</b> (số nhiều) → động từ giữ nguyên: <b>Birds fly south in winter.</b>" },
          { q: "Which of the following is grammatically correct?", options: ["My grandparents lives in the countryside.", "My grandparents live in the countryside.", "My grandparents is living in the countryside.", "My grandparents living in the countryside."], answer: 1, vi: "Ông bà tôi sống ở nông thôn.", explain: "Chủ ngữ <b>My grandparents</b> (số nhiều) → động từ giữ nguyên: <b>My grandparents live in the countryside.</b>" }
        ]
      }
    ];

    /* =========================================================
       STATE
       ========================================================= */
    let state = {
      answers: {},
      checked: {}
    };

    const app = document.getElementById("app");
    const letters = ["A", "B", "C", "D"];

    /* =========================================================
       CHUẨN HÓA CÂU TRẢ LỜI
       ========================================================= */
    function normalize(s) {
      return s.toString()
        .toLowerCase()
        .trim()
        .replace(/\s+/g, " ")
        .replace(/[.,!?;:'"]/g, "")
        .replace(/[’‘]/g, "'")
        .replace(/\s*'\s*/g, "'");
    }

    function isAnswerCorrect(userAns, correctArr) {
      const u = normalize(userAns);
      return correctArr.some(a => normalize(a) === u);
    }

    /* =========================================================
       XÁO TRỘN
       ========================================================= */
    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    /* =========================================================
       RENDER ALL
       ========================================================= */
    function renderAll() {
      const totalQuestions = SECTIONS.reduce((s, sec) => s + sec.questions.length, 0);

      app.innerHTML = `
    <div class="print-header">
      <h1>PRESENT SIMPLE EXERCISES</h1>
     
    </div>

    <button class="exit-print" id="exitPrint">← Quay lại làm bài</button>

    <div class="exercise-hero">
      <button class="print-toggle" id="printToggle">🖨️ Print the exercises</button>
      <button class="print-answer-toggle" id="printAnswerToggle">Print along with the answers</button>
      <h1>PRESENT SIMPLE EXERCISES</h1>
      <div class="exercise-meta">
        <span class="meta-pill">📚 <strong>${SECTIONS.length}</strong> types of exercises</span>
        <span class="meta-pill">❓ <strong>${totalQuestions}</strong>questions </span>

      </div>
    </div>

    <div class="score-bar" id="scoreBar">
      <span class="stat correct">✓ <span id="statCorrect">0</span> correct</span>
      <span class="stat wrong">✕ <span id="statWrong">0</span> wrong</span>
      <div class="progress-mini"><div class="fill" id="progressFill"></div></div>
      <span class="stat progress"><span id="statProgress">0</span>/${totalQuestions}</span>
    </div>

    <div id="sectionsContainer"></div>

    <div class="bottom-action">
      <h3>Hoàn thành tất cả các câu hỏi 🎯</h3>
      <p>Bấm nút bên dưới để chấm điểm và xem kết quả chi tiết.</p>
      <button class="btn btn-primary" id="submitBtn">
        Nộp bài & Xem kết quả <span class="arrow">→</span>
      </button>
    </div>

    <div class="answer-key" id="answerKey"></div>
  `;

      const container = document.getElementById("sectionsContainer");
      SECTIONS.forEach(sec => container.appendChild(renderSection(sec)));

      renderAnswerKey();
      updateScoreBar();
      document.getElementById("submitBtn").addEventListener("click", submitAll);
      bindPrintButtons();
    }

    /* =========================================================
       RENDER SECTION
       ========================================================= */
    function renderSection(sec) {
      const wrap = document.createElement("div");
      wrap.className = "section-block";
      wrap.innerHTML = `
    <div class="section-header">
      <div class="text">
        <h2>${sec.title}</h2>
        <p>${sec.desc}</p>
      </div>
      <span class="badge-count">${sec.questions.length} câu</span>
    </div>
    <div class="q-list"></div>
  `;

      const qList = wrap.querySelector(".q-list");
      sec.questions.forEach((q, i) => qList.appendChild(renderQuestion(sec, q, i)));
      return wrap;
    }

    /* =========================================================
       RENDER CÂU HỎI
       ========================================================= */
    function renderQuestion(sec, q, i) {
      const key = `${sec.id}_${i}`;
      const el = document.createElement("div");
      el.className = "q-item";
      el.dataset.key = key;

      let headHTML = `
    <div class="q-head">
      <span class="q-num">${i + 1}</span> 
      <div class="q-body">
        <div class="q-text">${q.q || ""}</div>
      </div>
    </div>
  `;

      let bodyHTML = "";

      if (sec.type === "mcq" || sec.type === "correct") {
        bodyHTML = `
      <div class="options ${sec.type} ">
        ${q.options.map((opt, idx) => `
          <button class="option" data-idx="${idx}" data-key="${key}">
            <span class="key">${letters[idx]}</span>
            <span class="text">${opt}</span>
          </button>
        `).join("")}
      </div>
    `;
      }
      else if (sec.type === "fill") {
        bodyHTML = `
      <div class="input-wrap">
        <input type="text" class="text-input" data-key="${key}"
               placeholder="Nhập đáp án của bạn..." autocomplete="off" spellcheck="false" />
        <button class="btn btn-primary btn-check" data-key="${key}" style="padding:12px 22px;font-size:14px">
          Kiểm tra
        </button>
      </div>
    `;
      }
      else if (sec.type === "reorder") {
        const shuffled = shuffleArray([...q.words]);
        bodyHTML = `
      <div class="reorder-words" data-key="${key}">
        ${shuffled.map((w, idx) => `
          <button class="word-chip" data-word="${w}" data-idx="${idx}">${w}</button>
        `).join("")}
      </div>
      <div class="reorder-answer" data-key="${key}">
        <span class="reorder-placeholder"></span>
      </div>
      <div class="reorder-actions">
        <button class="btn btn-ghost-dark btn-reset" data-key="${key}">↺ Xóa hết</button>
        <button class="btn btn-primary btn-check" data-key="${key}">Kiểm tra</button>
      </div>
    `;
      }
      else if (sec.type === "translate") {
        bodyHTML = `
     
      <textarea class="textarea" data-key="${key} rows = "1"
                placeholder="Dịch câu trên sang tiếng Anh..." spellcheck="false"></textarea>
      <div class="input-wrap" style="margin-top:10px">
        <button class="btn btn-primary btn-check" data-key="${key}" style="padding:12px 22px;font-size:14px">
          Kiểm tra
        </button>
      </div>
    `;
      }

      el.innerHTML = headHTML + bodyHTML;

      if (sec.type === "mcq" || sec.type === "correct") {
        el.querySelectorAll(".option").forEach(btn => {
          btn.addEventListener("click", () => {
            if (state.checked[key]) return;
            selectMCQ(sec, q, key, parseInt(btn.dataset.idx), el);
          });
        });
      }

      if (sec.type === "fill" || sec.type === "translate") {
        const checkBtn = el.querySelector(".btn-check");
        const input = el.querySelector(".text-input, .textarea");
        checkBtn.addEventListener("click", () => {
          if (state.checked[key]) return;
          checkText(sec, q, key, el);
        });
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && sec.type === "fill" && !state.checked[key]) {
            e.preventDefault();
            checkText(sec, q, key, el);
          }
        });
      }

      if (sec.type === "reorder") {
        initReorder(el, key, q);
      }

      return el;
    }

    /* =========================================================
       RENDER ĐÁP ÁN (kèm dịch nghĩa)
       ========================================================= */
    function renderAnswerKey() {
      const keyEl = document.getElementById("answerKey");
      if (!keyEl) return;

      const sectionsHTML = SECTIONS.map(sec => {
        const itemsHTML = sec.questions.map((q, i) => {
          let answerText = "";
          let explainText = q.explain || "";

          if (sec.type === "mcq" || sec.type === "correct") {
            answerText = letters[q.answer] + ". " + q.options[q.answer];
          } else if (sec.type === "fill") {
            answerText = q.answer[0];
          } else if (sec.type === "reorder") {
            answerText = q.answer[0].charAt(0).toUpperCase() + q.answer[0].slice(1) + ".";
          } else if (sec.type === "translate") {
            answerText = q.answer[0].charAt(0).toUpperCase() + q.answer[0].slice(1) + ".";
            if (q.answer.length > 1) {
              const alt = q.answer.slice(1).map(a =>
                a.charAt(0).toUpperCase() + a.slice(1) + "."
              ).join(" · ");
              explainText = "<b>Chấp nhận:</b> " + alt + (explainText ? " · " + explainText : "");
            }
          }

          const viLine = q.vi
            ? `<div class="vi-line">📖 <b>Dịch:</b> ${q.vi}</div>`
            : "";

          return `
        <li>
          <span class="num">${i + 1}.</span>
          <span class="ans-body">
            <span>
              <span class="ans">${answerText}</span>
              ${explainText ? `<span class="exp">— ${explainText}</span>` : ""}
            </span>
            ${viLine}
          </span>
        </li>
      `;
        }).join("");

        return `
      <div class="section-key">
        <h3><span class="key-icon">${sec.icon}</span> ${sec.title}</h3>
        <ul class="key-list">${itemsHTML}</ul>
      </div>
    `;
      }).join("");

      keyEl.innerHTML = `
    <span class="cut-label">✂ Cắt theo đường kẻ — ĐÁP ÁN</span>
    <h2>PHẦN ĐÁP ÁN</h2>
    <p class="sub">Dùng để giáo viên chấm hoặc học sinh tự kiểm tra sau khi làm xong</p>
    ${sectionsHTML}
  `;
    }

    /* =========================================================
       CHẾ ĐỘ IN
       ========================================================= */
    function enterPrintMode() {
      document.body.classList.add("print-mode");
      document.title = "In bài tập – English grammar";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function exitPrintMode() {
      document.body.classList.remove("print-mode");
      document.body.classList.remove("answer-key-on");
      const answerToggle = document.getElementById("printAnswerToggle");
      if (answerToggle) {
        answerToggle.classList.remove("active");
        answerToggle.innerHTML = "📖 Kèm đáp án";
      }
      document.title = "Làm bài tập – Ngữ pháp tiếng Anh";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function bindPrintButtons() {
      const toggle = document.getElementById("printToggle");
      const exit = document.getElementById("exitPrint");
      const answerToggle = document.getElementById("printAnswerToggle");

      if (toggle) toggle.addEventListener("click", enterPrintMode);
      if (exit) exit.addEventListener("click", exitPrintMode);

      if (answerToggle) {
        answerToggle.addEventListener("click", () => {
          document.body.classList.toggle("answer-key-on");
          answerToggle.classList.toggle("active");
          answerToggle.innerHTML = document.body.classList.contains("answer-key-on")
            ? "📖 Ẩn đáp án"
            : "📖 Kèm đáp án";
        });
      }
    }

    /* =========================================================
       XỬ LÝ MCQ
       ========================================================= */
    function selectMCQ(sec, q, key, idx, el) {
      state.answers[key] = idx;
      state.checked[key] = true;

      const isCorrect = idx === q.answer;
      el.classList.add(isCorrect ? "correct" : "wrong");

      el.querySelectorAll(".option").forEach(btn => {
        const i = parseInt(btn.dataset.idx);
        btn.classList.add("disabled");
        if (i === q.answer) btn.classList.add("correct");
        else if (i === idx) btn.classList.add("wrong");
        else btn.classList.add("dimmed");
      });

      appendFeedback(el, isCorrect, q, letters[q.answer] + ". " + q.options[q.answer]);
      updateScoreBar();
      setTimeout(() => scrollToNext(el), 400);
    }

    /* =========================================================
       XỬ LÝ ĐIỀN TỪ / DỊCH
       ========================================================= */
    function checkText(sec, q, key, el) {
      const input = el.querySelector(".text-input, .textarea");
      const val = input.value.trim();
      if (!val) {
        input.focus();
        input.style.borderColor = "var(--yellow)";
        setTimeout(() => { input.style.borderColor = ""; }, 800);
        return;
      }

      state.answers[key] = val;
      state.checked[key] = true;

      const isCorrect = isAnswerCorrect(val, q.answer);
      el.classList.add(isCorrect ? "correct" : "wrong");
      input.disabled = true;

      const btn = el.querySelector(".btn-check");
      if (btn) btn.style.display = "none";

      const correctDisplay = Array.isArray(q.answer) ? q.answer[0] : q.answer;
      appendFeedback(el, isCorrect, q, correctDisplay);
      updateScoreBar();
      setTimeout(() => scrollToNext(el), 400);
    }

    /* =========================================================
       XỬ LÝ SẮP XẾP TỪ
       ========================================================= */
    function initReorder(el, key, q) {
      const wordsBox = el.querySelector(".reorder-words");
      const answerBox = el.querySelector(".reorder-answer");
      const resetBtn = el.querySelector(".btn-reset");
      const checkBtn = el.querySelector(".btn-check");

      function updatePlaceholder() {
        const chips = answerBox.querySelectorAll(".word-chip-answer");
        if (chips.length === 0) {
          answerBox.innerHTML = `<span class="reorder-placeholder">👆 Bấm vào các từ bên trên để xếp câu</span>`;
        }
      }

      wordsBox.querySelectorAll(".word-chip").forEach(chip => {
        chip.addEventListener("click", () => {
          if (state.checked[key] || chip.classList.contains("used")) return;
          chip.classList.add("used");

          const ph = answerBox.querySelector(".reorder-placeholder");
          if (ph) ph.remove();

          const newChip = document.createElement("button");
          newChip.className = "word-chip-answer";
          newChip.textContent = chip.dataset.word;
          newChip.dataset.idx = chip.dataset.idx;
          newChip.addEventListener("click", () => {
            if (state.checked[key]) return;
            newChip.remove();
            chip.classList.remove("used");
            updatePlaceholder();
          });
          answerBox.appendChild(newChip);
        });
      });

      resetBtn.addEventListener("click", () => {
        if (state.checked[key]) return;
        answerBox.querySelectorAll(".word-chip-answer").forEach(c => c.remove());
        wordsBox.querySelectorAll(".word-chip").forEach(c => c.classList.remove("used"));
        updatePlaceholder();
      });

      checkBtn.addEventListener("click", () => {
        if (state.checked[key]) return;
        const chips = answerBox.querySelectorAll(".word-chip-answer");
        if (chips.length === 0) {
          answerBox.style.borderColor = "var(--yellow)";
          setTimeout(() => { answerBox.style.borderColor = ""; }, 800);
          return;
        }

        const userSentence = Array.from(chips).map(c => c.textContent).join(" ");
        state.answers[key] = userSentence;
        state.checked[key] = true;

        const isCorrect = isAnswerCorrect(userSentence, q.answer);

        el.classList.add(isCorrect ? "correct" : "wrong");
        chips.forEach(c => { c.disabled = true; });
        wordsBox.querySelectorAll(".word-chip").forEach(c => { c.disabled = true; });
        resetBtn.style.display = "none";
        checkBtn.style.display = "none";

        const correctDisplay = q.answer[0].charAt(0).toUpperCase() + q.answer[0].slice(1) + ".";
        appendFeedback(el, isCorrect, q, correctDisplay);
        updateScoreBar();
        setTimeout(() => scrollToNext(el), 400);
      });
    }

    /* =========================================================
       FEEDBACK (kèm dịch nghĩa)
       ========================================================= */
    function appendFeedback(el, isCorrect, q, correctDisplay) {
      const fb = document.createElement("div");
      fb.className = `feedback ${isCorrect ? "correct" : "wrong"}`;
      const viLine = q.vi ? `<span class="fb-vi">📖 Dịch: ${q.vi}</span>` : "";
      fb.innerHTML = `
    <span class="emoji">${isCorrect ? "🎉" : "💡"}</span>
    <div>
      <b>${isCorrect ? "Chính xác!" : "Chưa đúng!"}</b>
      ${!isCorrect ? ` Đáp án đúng: <span class="correct-ans">${correctDisplay}</span>.<br>` : " "}
      ${q.explain}
      ${viLine}
    </div>
  `;
      el.appendChild(fb);
    }

    /* =========================================================
       SCROLL CÂU TIẾP
       ========================================================= */
    function scrollToNext(currentEl) {
      const all = document.querySelectorAll(".q-item");
      const arr = Array.from(all);
      const idx = arr.indexOf(currentEl);
      if (idx >= 0 && idx < arr.length - 1) {
        const next = arr[idx + 1];
        const rect = next.getBoundingClientRect();
        const top = window.scrollY + rect.top - 120;
        window.scrollTo({ top, behavior: "smooth" });
      }
    }

    /* =========================================================
       CẬP NHẬT SCORE BAR
       ========================================================= */
    function updateScoreBar() {
      let correct = 0, wrong = 0;
      SECTIONS.forEach(sec => {
        sec.questions.forEach((q, i) => {
          const key = `${sec.id}_${i}`;
          if (!state.checked[key]) return;
          const userAns = state.answers[key];
          let isCorrect = false;
          if (sec.type === "mcq" || sec.type === "correct") {
            isCorrect = userAns === q.answer;
          } else {
            isCorrect = isAnswerCorrect(userAns, q.answer);
          }
          if (isCorrect) correct++; else wrong++;
        });
      });

      const total = SECTIONS.reduce((s, sec) => s + sec.questions.length, 0);
      const done = correct + wrong;

      document.getElementById("statCorrect").textContent = correct;
      document.getElementById("statWrong").textContent = wrong;
      document.getElementById("statProgress").textContent = done;
      document.getElementById("progressFill").style.width = (done / total * 100) + "%";
    }

    /* =========================================================
       NỘP BÀI
       ========================================================= */
    function submitAll() {
      let correct = 0, wrong = 0, unanswered = 0;
      SECTIONS.forEach(sec => {
        sec.questions.forEach((q, i) => {
          const key = `${sec.id}_${i}`;
          if (!state.checked[key]) { unanswered++; return; }
          const userAns = state.answers[key];
          let isCorrect = false;
          if (sec.type === "mcq" || sec.type === "correct") {
            isCorrect = userAns === q.answer;
          } else {
            isCorrect = isAnswerCorrect(userAns, q.answer);
          }
          if (isCorrect) correct++; else wrong++;
        });
      });

      const total = SECTIONS.reduce((s, sec) => s + sec.questions.length, 0);
      const percent = Math.round(correct / total * 100);

      let emoji = "🎉", title = "Xuất sắc!", sub = "Bạn đã nắm rất vững ngữ pháp.";
      if (percent < 50) { emoji = "💪"; title = "Cố gắng thêm!"; sub = "Hãy xem lại các bài học và thử lại."; }
      else if (percent < 70) { emoji = "👍"; title = "Khá tốt!"; sub = "Bạn hiểu cơ bản, luyện thêm để giỏi hơn."; }
      else if (percent < 90) { emoji = "🌟"; title = "Rất giỏi!"; sub = "Chỉ còn vài lỗi nhỏ, tiếp tục phát huy!"; }

      const overlay = document.createElement("div");
      overlay.className = "modal-overlay";
      overlay.innerHTML = `
    <div class="modal">
      <div class="modal-emoji">${emoji}</div>
      <h2>${title}</h2>
      <p class="sub">${sub}</p>
      <div class="score-big">${percent}%</div>
      <div class="score-detail">
        <b>${correct}</b> câu đúng · <span class="wrong-b">${wrong}</span> câu sai
        ${unanswered > 0 ? ` · <span style="color:var(--yellow)">${unanswered}</span> chưa làm` : ""}
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="window.location.href='index.html'">← Trang chủ</button>
        <button class="btn btn-primary" id="retryBtn">Làm lại 🔄</button>
      </div>
    </div>
  `;
      document.body.appendChild(overlay);

      overlay.querySelector("#retryBtn").addEventListener("click", () => {
        state = { answers: {}, checked: {} };
        overlay.remove();
        renderAll();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      overlay.addEventListener("click", (e) => {
        if (e.target === overlay) overlay.remove();
      });
    }

    /* =========================================================
       KHỞI ĐỘNG
       ========================================================= */
    renderAll();
  </script>
</body>

</html>
